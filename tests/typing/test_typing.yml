# typing tests

- case: mock_cls_mimics_type
  skip: sys.version_info < (3, 10)
  main: |
    from decoy.next import Decoy

    class Dependency():
        def do_thing(self, input: str) -> int:
            return 42

    decoy = Decoy()
    fake = decoy.mock(cls=Dependency)
    reveal_type(fake)
  out: |
    main:9: note: Revealed type is "main.Dependency"

