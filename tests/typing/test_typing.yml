- case: mock_class_attribute_set
  skip: sys.version_info < (3, 10)
  main: |
    from decoy.next import Decoy

    class Dependency():
        @property
        def value(self) -> int:
            return 42

    decoy = Decoy()
    fake = decoy.mock(cls=Dependency)

    # the set value is checked against the attribute type via `WhenSet.to`
    with decoy.when as when:
        when.set(fake.value).to(42).then_raise(Exception("oh no"))
        when.set(fake.value).to("goodbye").then_raise(Exception("oh no"))
  out: |
    main:14: error: Argument 1 to "to" of "WhenSet" has incompatible type "str"; expected "int"  [arg-type]

